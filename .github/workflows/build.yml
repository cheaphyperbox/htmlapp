name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/build-request

concurrency:
  group: htmlapp-main-build
  cancel-in-progress: true

jobs:
  build:
    name: Build HTMLApp IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (prefer 26, fallback to 16.4)
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH=""
          for candidate in /Applications/Xcode_26*.app /Applications/Xcode_16.4.app /Applications/Xcode.app; do
            if [ -d "$candidate" ]; then
              XCODE_PATH="$candidate"
              break
            fi
          done
          if [ -z "$XCODE_PATH" ]; then
            echo "No supported Xcode installation was found."
            ls -1 /Applications | grep Xcode || true
            exit 1
          fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install xcodegen

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          test -d "HTMLApp.xcodeproj"
          ls -la

      - name: Build unsigned universal device app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PWD/DerivedData"
          xcodebuild             -project "HTMLApp.xcodeproj"             -scheme "HTMLApp"             -configuration Release             -sdk iphoneos             -destination "generic/platform=iOS"             -derivedDataPath "$PWD/DerivedData"             IPHONEOS_DEPLOYMENT_TARGET=16.0             TARGETED_DEVICE_FAMILY="1,2"             SUPPORTS_MACCATALYST=NO             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             SKIP_INSTALL=NO             build

      - name: Verify icon and version metadata
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$PWD/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'HTMLApp.app' -type d | head -n 1)"
          MASTER="$PWD/HTMLApp/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Assets.car"
          test -f "$MASTER"
          WIDTH="$(/usr/bin/sips -g pixelWidth "$MASTER" | awk '/pixelWidth/ {print $2}')"
          HEIGHT="$(/usr/bin/sips -g pixelHeight "$MASTER" | awk '/pixelHeight/ {print $2}')"
          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          test "$VERSION" = "1.0.0"
          test "$BUILD" = "1"
          echo "Verified clean 1024x1024 generated AppIcon"
          echo "Verified HTMLApp version $VERSION ($BUILD)"
          echo "Verified compiled asset catalog: $APP_PATH/Assets.car"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$PWD/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'HTMLApp.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "HTMLApp.app was not found."
            find "$PWD/DerivedData/Build/Products" -maxdepth 3 -print || true
            exit 1
          fi

          rm -rf Payload HTMLApp-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload HTMLApp-unsigned.ipa
          test -f HTMLApp-unsigned.ipa
          ls -lh HTMLApp-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HTMLApp-unsigned-ipa
          path: HTMLApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Deliver IPA to Discord (optional)
        if: ${{ success() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "Discord delivery not configured; add DISCORD_WEBHOOK_URL as a repository Actions secret."
            exit 0
          fi
          echo "::add-mask::$DISCORD_WEBHOOK_URL"
          case "$DISCORD_WEBHOOK_URL" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*) ;;
            *) echo "Invalid Discord webhook secret."; exit 1 ;;
          esac
          MESSAGE="HTMLApp build #${GITHUB_RUN_NUMBER} succeeded. Unsigned IPA attached; native widgets and background refresh require correct App Group entitlements when signing."
          BODY="$(jq -nc --arg hook "$DISCORD_WEBHOOK_URL" --arg content "$MESSAGE" '{webhook_url:$hook,wait:true,payload:{content:$content,username:"HTMLApp Build Bot",allowed_mentions:{parse:[]}}}')"
          STATUS="$(curl --silent --show-error --max-time 30 --output /dev/null --write-out "%{http_code}" --header "Content-Type: application/json" --data-binary "$BODY" "https://mekapc.hostish.site/api/webhook" || true)"
          echo "HOSTISH notification HTTP $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "204" ]; then
            echo "HOSTISH text notification failed; continuing to attachment delivery."
          fi
          test -f HTMLApp-unsigned.ipa
          UPLOAD="$(curl --silent --show-error --max-time 120 --output discord-delivery-response.json --write-out "%{http_code}" -F 'payload_json={"content":"HTMLApp unsigned IPA build attached.","username":"HTMLApp Build Bot","allowed_mentions":{"parse":[]}}' -F 'files[0]=@HTMLApp-unsigned.ipa;filename=HTMLApp-unsigned.ipa;type=application/octet-stream' "$DISCORD_WEBHOOK_URL?wait=true")"
          echo "Discord attachment HTTP $UPLOAD"
          test "$UPLOAD" = "200" -o "$UPLOAD" = "204"
