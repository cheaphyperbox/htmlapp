name: Build HTMLApp IPA

# Manual-only workflow. Source commits and build-request changes must not trigger builds.
on:
  workflow_dispatch:

concurrency:
  group: htmlapp-main-build
  cancel-in-progress: true

jobs:
  build:
    name: Build HTMLApp IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (prefer 26, fallback to 16.4)
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH=""
          for candidate in /Applications/Xcode_26*.app /Applications/Xcode_16.4.app /Applications/Xcode.app; do
            if [ -d "$candidate" ]; then
              XCODE_PATH="$candidate"
              break
            fi
          done
          if [ -z "$XCODE_PATH" ]; then
            echo "No supported Xcode installation was found."
            ls -1 /Applications | grep Xcode || true
            exit 1
          fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Announce build start via HOSTISH
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then exit 0; fi
          echo "::add-mask::$DISCORD_WEBHOOK_URL"
          BODY="$(jq -nc --arg hook "$DISCORD_WEBHOOK_URL" --arg content "HTMLApp single IPA build started. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{webhook_url:$hook,wait:true,payload:{content:$content,username:"HTMLApp Build Bot",allowed_mentions:{parse:[]}}}')"
          STATUS="$(curl --silent --show-error --connect-timeout 10 --max-time 25 --output /dev/null --write-out '%{http_code}' --header 'Content-Type: application/json' --data-binary "$BODY" 'https://mekapc.hostish.site/api/webhook' || true)"
          echo "HOSTISH build-start HTTP $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "204" ]; then
            echo '::warning::HOSTISH proxy unavailable; trying direct Discord update without exposing credentials.'
            curl --silent --show-error --fail --connect-timeout 10 --max-time 25 --output /dev/null --header 'Content-Type: application/json' --data-binary "$(jq -nc --arg content "HTMLApp build started: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{content:$content,username:"HTMLApp Build Bot",allowed_mentions:{parse:[]}}')" "$DISCORD_WEBHOOK_URL" || true
          fi

      - name: Test JavaScript widget rejection diagnostics
        run: node scripts/test-widget-bridge.js

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          test -d "HTMLApp.xcodeproj"
          ls -la

      - name: Test widget storage and provider timelines
        shell: bash
        run: bash scripts/test-widgets.sh

      - name: Upload widget test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-test-results
          path: WidgetTests-*.xcresult
          if-no-files-found: warn

      - name: Build unsigned universal device app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PWD/DerivedData"
          BUILD_NUMBER="5"
          VERSION="1.4.0"
          echo "Building HTMLApp marketing version $VERSION (source revision $BUILD_NUMBER)"
          xcodebuild             -project "HTMLApp.xcodeproj"             -scheme "HTMLApp"             -configuration Release             -sdk iphoneos             -destination "generic/platform=iOS"             -derivedDataPath "$PWD/DerivedData"             IPHONEOS_DEPLOYMENT_TARGET=16.0             TARGETED_DEVICE_FAMILY="1,2"             SUPPORTS_MACCATALYST=NO             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             MARKETING_VERSION="$VERSION"             CURRENT_PROJECT_VERSION="$BUILD_NUMBER"             SKIP_INSTALL=NO             build

      - name: Verify icon and version metadata
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$PWD/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'HTMLApp.app' -type d | head -n 1)"
          MASTER="$PWD/HTMLApp/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Assets.car"
          test -f "$MASTER"
          WIDTH="$(/usr/bin/sips -g pixelWidth "$MASTER" | awk '/pixelWidth/ {print $2}')"
          HEIGHT="$(/usr/bin/sips -g pixelHeight "$MASTER" | awk '/pixelHeight/ {print $2}')"
          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          test "$VERSION" = "1.4.0"
          test "$BUILD" = "5"
          echo "Verified clean 1024x1024 generated AppIcon"
          echo "Verified HTMLApp version $VERSION ($BUILD)"
          echo "Verified compiled asset catalog: $APP_PATH/Assets.car"

      - name: Prepare app bundle for single IPA packaging
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$PWD/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'HTMLApp.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "HTMLApp.app was not found."
            find "$PWD/DerivedData/Build/Products" -maxdepth 3 -print || true
            exit 1
          fi

          rm -rf Payload HTMLApp.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          cp HTMLApp/HTMLApp.entitlements Payload/HTMLApp.app/WidgetSigningRequirements.plist
          cp HTMLAppWidgets/HTMLAppWidgets.entitlements Payload/HTMLApp.app/PlugIns/HTMLAppWidgets.appex/WidgetSigningRequirements.plist
      - name: Create entitlement-preserving HTMLApp IPA
        shell: bash
        run: |
          set -euo pipefail
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ldid
          test -f "Payload/HTMLApp.app/HTMLApp"
          test -f "Payload/HTMLApp.app/PlugIns/HTMLAppWidgets.appex/HTMLAppWidgets"
          cp -R Payload TrollStorePayload
          ldid -SHTMLApp/HTMLApp.entitlements "TrollStorePayload/HTMLApp.app/HTMLApp"
          ldid -SHTMLAppWidgets/HTMLAppWidgets.entitlements "TrollStorePayload/HTMLApp.app/PlugIns/HTMLAppWidgets.appex/HTMLAppWidgets"
          for path in "TrollStorePayload/HTMLApp.app/HTMLApp" "TrollStorePayload/HTMLApp.app/PlugIns/HTMLAppWidgets.appex/HTMLAppWidgets"; do
            ldid -e "$path" > "$path.entitlements.check"
            plutil -lint "$path.entitlements.check"
            grep -q 'group.com.mekabrine.htmlapp' "$path.entitlements.check"
            rm "$path.entitlements.check"
          done
          mkdir -p TrollStoreIPA/Payload
          cp -R TrollStorePayload/HTMLApp.app TrollStoreIPA/Payload/
          (cd TrollStoreIPA && ditto -c -k --sequesterRsrc --keepParent Payload ../HTMLApp.ipa)
          test -s HTMLApp.ipa
          echo "Verified embedded App Group in both TrollStore executables."

      - name: Verify packaged HTMLApp IPA
        run: python3 scripts/verify-ipa.py HTMLApp.ipa

      - name: Upload HTMLApp IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTMLApp-ipa
          path: HTMLApp.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Deliver IPA to Discord (optional)
        if: ${{ success() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: bash scripts/deliver-widgets.sh
