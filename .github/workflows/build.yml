name: Build HTMLApp IPA

# Manual-only workflow. Source commits and build-request changes must not trigger builds.
on:
  workflow_dispatch:
    inputs:
      run_widget_simulator_tests:
        description: "Also run slower simulator-based widget tests"
        required: false
        type: boolean
        default: false

concurrency:
  group: htmlapp-main-build
  cancel-in-progress: true

jobs:
  build:
    name: Build HTMLApp IPA
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode with iOS 26 SDK
        shell: bash
        run: |
          set -euo pipefail
          # The runner can contain multiple Xcode 26 releases. Prefer the
          # newest instead of accidentally selecting Xcode_26.0.1 first.
          XCODE_PATH=""
          while IFS= read -r candidate; do
            if [ -d "$candidate" ]; then XCODE_PATH="$candidate"; break; fi
          done < <(printf '%s\n' /Applications/Xcode_26*.app | sort -Vr)
          if [ -z "$XCODE_PATH" ] && [ -d /Applications/Xcode.app ]; then
            XCODE_PATH=/Applications/Xcode.app
          fi
          if [ -z "$XCODE_PATH" ]; then
            echo "No supported Xcode installation was found."
            ls -1 /Applications | grep Xcode || true
            exit 1
          fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          # Capture output once. Piping xcodebuild directly to awk with
          # early exit can crash Xcode with NSFileHandle broken pipe (134).
          XCODE_VERSION_OUTPUT="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION_OUTPUT"
          XCODE_MAJOR="$(printf '%s\n' "$XCODE_VERSION_OUTPUT" | awk '/^Xcode / {split($2, v, "."); print v[1]}')"
          if [ -z "$XCODE_MAJOR" ] || [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "Xcode 26 or newer is required to compile BGContinuedProcessingTask."
            exit 1
          fi

      - name: Ensure iOS SDK and simulator runtime
        shell: bash
        run: |
          set -euo pipefail
          # macOS 26 runner images can have Xcode installed without the
          # corresponding iOS platform components.
          if ! xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1; then
            echo "Installing missing iOS platform for the selected Xcode."
            xcodebuild -downloadPlatform iOS
          fi
          xcodebuild -showsdks
          xcrun simctl list runtimes available || true

      - name: Verify selected Xcode has an iOS device platform
        shell: bash
        run: |
          set -euo pipefail
          # -showsdks succeeds even when Xcode's device platform is missing.
          # Check the platform bundle directly and let xcodebuild install it.
          DEVELOPER_DIR="$(xcode-select -p)"
          PLATFORM="$DEVELOPER_DIR/Platforms/iPhoneOS.platform"
          if [ ! -d "$PLATFORM" ]; then
            echo "The selected Xcode lacks the iPhoneOS platform; downloading it."
            xcodebuild -downloadPlatform iOS
          fi
          if [ ! -d "$PLATFORM" ]; then
            echo "::error::Selected Xcode has no iPhoneOS platform."
            exit 1
          fi

      - name: Cache Swift package dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: ${{ runner.os }}-swiftpm-xcode26-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-xcode26-

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Announce build start in Discord (optional)
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then exit 0; fi
          echo "::add-mask::$DISCORD_WEBHOOK_URL"
          case "$DISCORD_WEBHOOK_URL" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*) ;;
            *) echo 'Invalid Discord webhook URL'; exit 1 ;;
          esac
          MESSAGE="HTMLApp build started: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --silent --show-error --fail --connect-timeout 10 --max-time 25 --output /dev/null \
            -H 'Content-Type: application/json' \
            --data-binary "$(jq -nc --arg content "$MESSAGE" '{content:$content,username:"HTMLApp Build Bot",allowed_mentions:{parse:[]}}')" \
            "$DISCORD_WEBHOOK_URL"

      - name: Check source release and safety invariants
        run: python3 scripts/test-source-invariants.py

      - name: Test JavaScript widget rejection diagnostics
        run: node scripts/test-widget-bridge.js

      - name: Test car display runtime
        run: node scripts/test-car-display.js

      - name: Check Swift source syntax before dependency compilation
        shell: bash
        run: |
          set -euo pipefail
          # Parse app/library files together, but not the standalone icon
          # generator script: it legitimately contains top-level statements.
          find HTMLAppV3 HTMLAppWidgets HTMLAppShared HTMLApp -name '*.swift' -type f \
            ! -path 'HTMLApp/GenerateAppIcon.swift' -print0 |
            xargs -0 xcrun swiftc -frontend -parse
          xcrun swiftc -frontend -parse HTMLApp/GenerateAppIcon.swift

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          test -d "HTMLApp.xcodeproj"
          ls -la

      - name: Validate device build destination
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project HTMLApp.xcodeproj -scheme HTMLApp -showdestinations > /tmp/htmlapp-build-destinations.txt 2>&1
          cat /tmp/htmlapp-build-destinations.txt
          if ! awk '/Available destinations/{active=1;next} /Ineligible destinations/{active=0} active && /platform:iOS,/ && /Any iOS Device/ {found=1} END{exit !found}' /tmp/htmlapp-build-destinations.txt; then
            echo "::warning::Generic iOS destination not listed; attempting iOS platform installation."
            xcodebuild -downloadPlatform iOS
          fi
          xcodebuild -project HTMLApp.xcodeproj -scheme HTMLApp -showdestinations

      - name: Test widget storage and provider timelines
        if: ${{ inputs.run_widget_simulator_tests }}
        shell: bash
        run: bash scripts/test-widgets.sh

      - name: Upload widget test results
        if: ${{ always() && inputs.run_widget_simulator_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: widget-test-results
          path: WidgetTests-*.xcresult
          if-no-files-found: warn

      - name: Build unsigned universal device app
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F '"' '/static let compiledVersion =/ {print $2; exit}' HTMLAppV3/HTMLAppWhatsNewView.swift)"
          BUILD_NUMBER="$(awk -F '"' '/static let compiledBuild =/ {print $2; exit}' HTMLAppV3/HTMLAppWhatsNewView.swift)"
          test -n "$VERSION" && test -n "$BUILD_NUMBER"
          echo "Building source release $VERSION ($BUILD_NUMBER)"
          echo "Building HTMLApp marketing version $VERSION (source revision $BUILD_NUMBER)"
          xcodebuild             -project "HTMLApp.xcodeproj"             -scheme "HTMLApp"             -configuration Release             -sdk iphoneos             -destination "generic/platform=iOS"             -derivedDataPath "$PWD/DerivedData"             IPHONEOS_DEPLOYMENT_TARGET=16.0             TARGETED_DEVICE_FAMILY="1,2"             SUPPORTS_MACCATALYST=NO             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             MARKETING_VERSION="$VERSION"             CURRENT_PROJECT_VERSION="$BUILD_NUMBER"             SKIP_INSTALL=NO             build

      - name: Repair and validate built app and widget version metadata
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$PWD/DerivedData/Build/Products/Release-iphoneos/HTMLApp.app"
          VERSION="$(awk -F '"' '/static let compiledVersion =/ {print $2; exit}' HTMLAppV3/HTMLAppWhatsNewView.swift)"
          BUILD="$(awk -F '"' '/static let compiledBuild =/ {print $2; exit}' HTMLAppV3/HTMLAppWhatsNewView.swift)"
          test -n "$VERSION" && test -n "$BUILD"
          for BUNDLE in "$APP_PATH" "$APP_PATH/PlugIns/HTMLAppWidgets.appex"; do
            PLIST="$BUNDLE/Info.plist"
            test -f "$PLIST"
            for PAIR in "CFBundleShortVersionString:$VERSION" "CFBundleVersion:$BUILD"; do
              KEY="${PAIR%%:*}"
              VALUE="${PAIR#*:}"
              /usr/libexec/PlistBuddy -c "Set :$KEY $VALUE" "$PLIST" ||
                /usr/libexec/PlistBuddy -c "Add :$KEY string $VALUE" "$PLIST"
              test "$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$PLIST")" = "$VALUE"
            done
            echo "Packaged version in $BUNDLE: $VERSION ($BUILD)"
          done

      - name: Verify icon and version metadata
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$PWD/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'HTMLApp.app' -type d | head -n 1)"
          MASTER="$PWD/HTMLApp/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Assets.car"
          test -f "$MASTER"
          WIDTH="$(/usr/bin/sips -g pixelWidth "$MASTER" | awk '/pixelWidth/ {print $2}')"
          HEIGHT="$(/usr/bin/sips -g pixelHeight "$MASTER" | awk '/pixelHeight/ {print $2}')"
          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          EXPECTED_VERSION="$(awk -F '"' '/static let compiledVersion =/ {print $2; exit}' HTMLAppV3/HTMLAppWhatsNewView.swift)"
          EXPECTED_BUILD="$(awk -F '"' '/static let compiledBuild =/ {print $2; exit}' HTMLAppV3/HTMLAppWhatsNewView.swift)"
          test "$VERSION" = "$EXPECTED_VERSION"
          test "$BUILD" = "$EXPECTED_BUILD"
          echo "Verified clean 1024x1024 generated AppIcon"
          echo "Verified HTMLApp version $VERSION ($BUILD)"
          echo "Verified compiled asset catalog: $APP_PATH/Assets.car"

      - name: Prepare app bundle for single IPA packaging
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$PWD/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'HTMLApp.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "HTMLApp.app was not found."
            find "$PWD/DerivedData/Build/Products" -maxdepth 3 -print || true
            exit 1
          fi

          rm -rf Payload HTMLApp.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          cp HTMLApp/HTMLApp.entitlements Payload/HTMLApp.app/WidgetSigningRequirements.plist
          cp HTMLAppWidgets/HTMLAppWidgets.entitlements Payload/HTMLApp.app/PlugIns/HTMLAppWidgets.appex/WidgetSigningRequirements.plist
      - name: Create entitlement-preserving HTMLApp IPA
        shell: bash
        run: |
          set -euo pipefail
          brew list ldid >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install ldid
          test -f "Payload/HTMLApp.app/HTMLApp"
          test -f "Payload/HTMLApp.app/PlugIns/HTMLAppWidgets.appex/HTMLAppWidgets"
          cp -R Payload TrollStorePayload
          ldid -SHTMLApp/HTMLApp.entitlements "TrollStorePayload/HTMLApp.app/HTMLApp"
          ldid -SHTMLAppWidgets/HTMLAppWidgets.entitlements "TrollStorePayload/HTMLApp.app/PlugIns/HTMLAppWidgets.appex/HTMLAppWidgets"
          for path in "TrollStorePayload/HTMLApp.app/HTMLApp" "TrollStorePayload/HTMLApp.app/PlugIns/HTMLAppWidgets.appex/HTMLAppWidgets"; do
            ldid -e "$path" > "$path.entitlements.check"
            plutil -lint "$path.entitlements.check"
            grep -q 'group.com.mekabrine.htmlapp' "$path.entitlements.check"
            rm "$path.entitlements.check"
          done
          mkdir -p TrollStoreIPA/Payload
          cp -R TrollStorePayload/HTMLApp.app TrollStoreIPA/Payload/
          (cd TrollStoreIPA && ditto -c -k --sequesterRsrc --keepParent Payload ../HTMLApp.ipa)
          test -s HTMLApp.ipa
          echo "Verified embedded App Group in both TrollStore executables."

      - name: Verify packaged HTMLApp IPA
        run: python3 scripts/verify-ipa.py HTMLApp.ipa

      - name: Upload HTMLApp IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTMLApp-ipa
          path: HTMLApp.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Deliver IPA to Discord (optional)
        if: ${{ success() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: bash scripts/deliver-widgets.sh

      - name: Notify Discord if build fails
        if: ${{ failure() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "Discord webhook not configured; skipping failure notification."
            exit 0
          fi
          echo "::add-mask::$DISCORD_WEBHOOK_URL"
          case "$DISCORD_WEBHOOK_URL" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*) ;;
            *) echo "::warning::Discord webhook URL is invalid."; exit 0 ;;
          esac
          LINK="https://github.com/$GH_REPO/actions/runs/$GH_RUN_ID/attempts/$GH_RUN_ATTEMPT"
          MESSAGE="HTMLApp IPA build failed. Inspect the failed step and logs: $LINK"
          PAYLOAD="$(jq -nc --arg content "$MESSAGE" '{content:$content,username:"HTMLApp Build Bot",allowed_mentions:{parse:[]}}')"
          curl --fail --silent --show-error --retry 2 --connect-timeout 10 --max-time 25 \
            -H 'Content-Type: application/json' \
            --data-binary "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

