name: HOSTISH Summary Retry
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
jobs:
  relay:
    if: github.event.issue.title == 'HOSTISH HTMLApp Summary Retry' && github.event.comment.user.login == 'mekabrine'
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Send build summary securely through HOSTISH
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DISCORD_WEBHOOK_URL:-}"
          echo "::add-mask::$DISCORD_WEBHOOK_URL"
          case "$DISCORD_WEBHOOK_URL" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*) ;;
            *) echo "Webhook secret format invalid"; exit 1 ;;
          esac
          CONTENT="HTMLApp build complete. App Group compatible recovery, Forge research transparency, iOS adaptive UI guidance, and AI edit dictation updated. IPA was already attached successfully to Discord. Build: https://github.com/mekabrine/htmlapp/actions/runs/39321974744. The physical original App Group remains subject to signing authorization."
          BODY="$(jq -nc --arg hook "$DISCORD_WEBHOOK_URL" --arg message "$CONTENT" '{webhook_url:$hook,wait:true,payload:{content:$message,username:"HTMLApp Build Bot",allowed_mentions:{parse:[]}}}')"
          for attempt in 1 2 3; do
            status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' --data-binary "$BODY" 'https://mekapc.hostish.site/api/webhook' || true)"
            echo "HOSTISH retry $attempt HTTP $status"
            if [ "$status" = 200 ] || [ "$status" = 204 ]; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 3))"; fi
          done
          exit 1
