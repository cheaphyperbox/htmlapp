name: HTMLApp
options:
  bundleIdPrefix: com.mekabrine
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
targets:
  HTMLApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: HTMLAppV3
      - path: HTMLApp/WebClipSupport.swift
    resources:
      - path: HTMLApp/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mekabrine.htmlapp
        PRODUCT_NAME: HTMLApp
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HTMLApp
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arm64
    info:
      path: HTMLApp/Info.plist
      properties:
        CFBundleDisplayName: HTMLApp
        NSCameraUsageDescription: HTML apps can use the camera only after you allow that saved app and approve the iOS permission.
        NSMicrophoneUsageDescription: HTML apps can use the microphone only after you allow that saved app and approve the iOS permission.
        NSLocationWhenInUseUsageDescription: HTML apps can request your location only after you allow that saved app and approve the iOS permission.
        NSMotionUsageDescription: HTML apps can use motion, orientation, and compass-related sensor events only after you allow that saved app.
        NSPhotoLibraryUsageDescription: HTML apps may request access to photos you select.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.mekabrine.htmlapp
            CFBundleURLSchemes:
              - htmlapp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
