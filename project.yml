name: HTMLApp
options:
  bundleIdPrefix: com.mekabrine
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "1.6.47"
    CURRENT_PROJECT_VERSION: "55"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "0.9.0"
targets:
  HTMLApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: HTMLAppV3
      - path: HTMLAppShared
      - path: HTMLApp/WebClipSupport.swift
      - path: HTMLApp/Assets.xcassets
        buildPhase: resources
    preBuildScripts:
      - name: Generate AppIcon Assets
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          ROOT="${SRCROOT}/HTMLApp"
          ICONSET="${ROOT}/Assets.xcassets/AppIcon.appiconset"
          WORK="${DERIVED_FILE_DIR}/HTMLApp-AppIcon"
          MASTER="${WORK}/AppIcon-1024.png"
          MACOS_SDK="$(/usr/bin/xcrun --sdk macosx --show-sdk-path)"

          mkdir -p "${WORK}" "${ICONSET}"
          /usr/bin/env -u IPHONEOS_DEPLOYMENT_TARGET -u PLATFORM_NAME \
            SDKROOT="${MACOS_SDK}" \
            /usr/bin/xcrun --sdk macosx swift "${ROOT}/GenerateAppIcon.swift" "${MASTER}"

          make_icon() {
            local pixels="$1"
            local filename="$2"
            /usr/bin/sips -z "${pixels}" "${pixels}" "${MASTER}" --out "${ICONSET}/${filename}" >/dev/null
          }

          cp "${MASTER}" "${ICONSET}/AppIcon-1024.png"
          make_icon 20 "AppIcon-20.png"
          make_icon 29 "AppIcon-29.png"
          make_icon 40 "AppIcon-40.png"
          make_icon 40 "AppIcon-20@2x.png"
          make_icon 58 "AppIcon-29@2x.png"
          make_icon 60 "AppIcon-20@3x.png"
          make_icon 76 "AppIcon-76.png"
          make_icon 80 "AppIcon-40@2x.png"
          make_icon 87 "AppIcon-29@3x.png"
          make_icon 120 "AppIcon-40@3x.png"
          make_icon 120 "AppIcon-60@2x.png"
          make_icon 152 "AppIcon-76@2x.png"
          make_icon 167 "AppIcon-83.5@2x.png"
          make_icon 180 "AppIcon-60@3x.png"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mekabrine.htmlapp
        PRODUCT_NAME: HTMLApp
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_ENTITLEMENTS: HTMLApp/HTMLApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HTMLApp/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: HTMLApp
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arm64
    info:
      path: HTMLApp/Info.plist
      properties:
        CFBundleDisplayName: HTMLApp
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSUbiquitousContainers:
          iCloud.com.mekabrine.htmlapp:
            NSUbiquitousContainerIsDocumentScopePublic: false
            NSUbiquitousContainerName: HTMLApp
        # A launch screen is required for native-resolution iPhone rendering.
        # Without it, iOS can run the entire SwiftUI/WKWebView app in a
        # legacy 320-point compatibility viewport with black letterboxing.
        UILaunchScreen: {}
        NSSpeechRecognitionUsageDescription: Dictate an app idea. Speech may be processed by Apple when on-device recognition is unavailable.
        NSBonjourServices:
          - _htmlapp-share._tcp
        NSHealthShareUsageDescription: Saved HTML apps can request read-only access to selected Health data after you approve that app and the iOS Health permission.
        NFCReaderUsageDescription: Saved HTML apps can scan an NFC tag only while you explicitly run a scan.
        NSCameraUsageDescription: HTML apps can use the camera only after you allow that saved app and approve the iOS permission.
        NSMicrophoneUsageDescription: Dictate app ideas in Forge or allow a saved HTMLApp to use the microphone.
        NSLocationWhenInUseUsageDescription: HTML apps can request your location only after you allow that saved app and approve the iOS permission.
        NSBluetoothAlwaysUsageDescription: HTMLApps may discover nearby Bluetooth Low Energy devices only after permission and your request to scan.
        NSBluetoothPeripheralUsageDescription: HTMLApps may discover nearby Bluetooth Low Energy devices only after permission and your request to scan.
        NSMotionUsageDescription: HTML apps can use motion, orientation, and compass-related sensor events only after you allow that saved app.
        NSPhotoLibraryUsageDescription: HTML apps may request access to photos you select.
        NSPhotoLibraryAddUsageDescription: HTML apps can save media to Photos only after you allow that saved app and approve the iOS permission.
        NSContactsUsageDescription: HTML apps can access contacts only after you allow that saved app and approve the iOS permission.
        NSCalendarsUsageDescription: HTML apps can read and create calendar events only after you allow that saved app and approve the iOS permission.
        NSCalendarsFullAccessUsageDescription: HTML apps can read and create calendar events only after you allow that saved app and approve the iOS permission.
        NSRemindersUsageDescription: HTML apps can read and create reminders only after you allow that saved app and approve the iOS permission.
        NSRemindersFullAccessUsageDescription: HTML apps can read and create reminders only after you allow that saved app and approve the iOS permission.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSFaceIDUsageDescription: HTML apps can request Face ID only after you allow that saved app and start an authentication action.
        NSLocalNetworkUsageDescription: HTML apps can connect to devices and servers on your local network only after you allow that saved app and approve iOS Local Network access.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.mekabrine.htmlapp
            CFBundleURLSchemes:
              - htmlapp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        BGTaskSchedulerPermittedIdentifiers:
          - com.mekabrine.htmlapp.refresh
          - com.mekabrine.htmlapp.forge.*
        UIBackgroundModes:
          - audio
          - fetch
          - processing
    dependencies:
      - package: WhisperKit
      - target: HTMLAppWidgets
        embed: true

  HTMLAppWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: HTMLAppWidgets
      - path: HTMLAppShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mekabrine.htmlapp.widgets
        PRODUCT_NAME: HTMLAppWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: HTMLAppWidgets/HTMLAppWidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HTMLAppWidgets/Info.plist
    info:
      path: HTMLAppWidgets/Info.plist
      properties:
        CFBundleDisplayName: HTMLApp Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension


  HTMLAppWidgetTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: HTMLAppShared
      - path: HTMLAppWidgets/HTMLAppWidgets.swift
      - path: HTMLAppV3/AIIconRenderer.swift
      - path: HTMLAppWidgetTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mekabrine.htmlapp.widgettests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_TESTING"

schemes:
  HTMLAppWidgetTests:
    build:
      targets:
        HTMLAppWidgetTests: all
    test:
      targets:
        - HTMLAppWidgetTests

